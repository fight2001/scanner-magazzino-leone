<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14151a">
<title>Scanner Magazzino LEONE</title>
<style>
:root{
  --bg:#14151a; --panel:#1d1f26; --line:#2d303a; --fg:#eceef2; --muted:#9aa0ae;
  --accent:#e0a93b; --accent-fg:#1a1405; --ok:#4cc38a; --warn:#e5a23a; --bad:#ef6a5e;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
html{min-height:100%}
body{min-height:100dvh}
body{background:var(--bg);color:var(--fg);font:16px/1.35 var(--font);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-bottom,0px));
  display:flex;flex-direction:column;gap:12px;overflow-x:hidden}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-size:17px;margin:0;letter-spacing:.02em}
h1 small{display:block;font-size:12px;font-weight:400;color:var(--muted);letter-spacing:0}
.status{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--ok)}.dot.wait{background:var(--warn)}.dot.bad{background:var(--bad)}
button{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:700}
.cam{position:relative;border-radius:14px;overflow:hidden;background:#000;aspect-ratio:4/3;max-height:42vh;width:100%}
.cam video{width:100%;height:100%;object-fit:cover;display:block}
.cam .frame{position:absolute;inset:22% 8%;border:2px solid var(--accent);border-radius:10px;box-shadow:0 0 0 999px rgba(0,0,0,.35);pointer-events:none}
.cam .msg{position:absolute;left:0;right:0;bottom:0;padding:8px 12px;font-size:13px;background:rgba(0,0,0,.6);text-align:center}
.row{display:flex;gap:8px}
.row input{flex:1;min-width:0}
input[type=text],input[type=search],input[type=url]{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
.results{display:flex;flex-direction:column;gap:6px}
.results button{text-align:left;display:flex;justify-content:space-between;gap:8px}
.results .sku{color:var(--accent);font-variant-numeric:tabular-nums;font-weight:700}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;flex:none}
.sheet[hidden]{display:none}
.sheet h2{margin:0;font-size:17px}
.sheet .code{color:var(--accent);font-weight:700;font-variant-numeric:tabular-nums;font-size:13px}
.variants{display:flex;flex-direction:column;gap:6px;}
.var{display:grid;grid-template-columns:1fr auto auto auto;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:6px 8px 6px 12px}
.var .lab{min-width:0;overflow-wrap:anywhere}
.var .n{font-variant-numeric:tabular-nums;font-weight:700;min-width:2.2ch;text-align:center;font-size:18px}
.var button{width:46px;height:42px;padding:0;font-size:22px;line-height:1}
.var button.plus{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:700}
.hint{color:var(--muted);font-size:13px}
.var.hit{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(18px,env(safe-area-inset-bottom,0px));background:#000;color:#fff;border:1px solid var(--line);padding:10px 14px;border-radius:10px;font-size:14px;max-width:90vw;z-index:5}
dialog{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:14px;width:min(520px,92vw);padding:16px}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog h2{margin:0 0 8px;font-size:17px}
dialog .row{margin-top:10px;justify-content:flex-end}
footer{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
footer button{padding:6px 10px;font-size:13px}
[hidden]{display:none!important}
.cesta{display:flex;gap:8px;align-items:center;margin:0 0 10px}
.cesta input{flex:1;min-width:0}
.badge{flex:1;background:#20301f;border:1px solid #3f7f3b;color:#bff0b8;border-radius:10px;padding:10px 12px;font-weight:600}
.badge small{font-weight:400;opacity:.85;margin-left:6px}
</style>
</head>
<body>
<header>
  <h1>Magazzino LEONE<small id="catinfo">caricamento catalogo…</small></h1>
  <div class="status"><span class="dot wait" id="dot"></span><span id="stat">…</span></div>
</header>

<div class="cesta" id="cestaBar">
  <div id="cestaNew" class="cesta" style="margin:0;flex:1">
    <input id="cestaN" type="text" placeholder="Numero cesta (es. 3)" autocomplete="off" autocapitalize="characters" enterkeyhint="go">
    <button id="cestaStart" class="primary" type="button">Inizia cesta</button>
  </div>
  <div id="cestaOn" class="cesta" style="margin:0;flex:1" hidden>
    <div class="badge" id="cestaBadge"></div>
    <button id="cestaEnd" type="button">Chiudi cesta</button>
  </div>
</div>

<div class="cam" id="cam">
  <video id="video" playsinline muted></video>
  <div class="frame"></div>
  <div class="msg" id="camMsg">Avvio fotocamera…</div>
</div>

<div class="row">
  <input id="q" type="search" placeholder="Cerca codice o nome (es. GN010)" autocomplete="off" enterkeyhint="search">
  <button id="camBtn" type="button">Fotocamera</button>
  <button id="photoBtn" type="button">Foto</button>
  <input id="photo" type="file" accept="image/*" capture="environment" hidden>
</div>
<div class="results" id="results"></div>

<section class="sheet" id="sheet" hidden>
  <div>
    <div class="code" id="shCode"></div>
    <h2 id="shName"></h2>
  </div>
  <div class="variants" id="variants"></div>
  <button class="primary" id="closeSheet" type="button">Scansiona altro</button>
</section>

<footer>
  <span id="tot">0 pezzi contati su questo telefono</span>
  <span><button id="cfgBtn" type="button">Collegamento</button></span>
</footer>

<dialog id="endDlg">
  <h2 id="endTitle"></h2>
  <p class="hint" id="endMsg"></p>
  <div class="row">
    <button id="endNo" type="button">Continua</button>
    <button id="endYes" class="primary" type="button">Chiudi cesta</button>
  </div>
</dialog>

<dialog id="cfg">
  <h2>Collegamento al Google Sheet</h2>
  <p class="hint">Incolla l'indirizzo dell'app web dello script (termina con /exec).</p>
  <input id="cfgUrl" type="url" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off">
  <p class="hint" id="cfgMsg"></p>
  <div class="row">
    <button id="cfgTest" type="button">Prova</button>
    <button id="cfgSave" class="primary" type="button">Salva</button>
    <button id="cfgClose" type="button">Chiudi</button>
  </div>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id)};
var LS={
  get:function(k,d){try{var v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},
  set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};

var catalog={};            // codice -> [{n:nome, v:[varianti]}]
var searchIdx=[];          // [{sku,n,key}]
var endpoint=LS.get('endpoint','');
var queue=LS.get('queue',[]);
var cesta=LS.get('cesta',null);   // {n:'CESTA 3',t}
var counts=LS.get('counts',{});   // "SKU|variante" -> pezzi contati da questo telefono
var current=null;          // codice aperto nel pannello
var flushing=false, flushTimer=null;
var lastSeen={code:'',t:0};
var codes=LS.get('codes',{});   // codice a barre -> {sku,n,v}
var pendingAssoc=null;

/* ---------- configurazione da link (#u=...) ---------- */
(function(){
  var m=/[#&]u=([^&]+)/.exec(location.hash||'');
  if(m){
    try{var u=decodeURIComponent(m[1]);if(/^https:\/\/script\.google\.com\//.test(u)){endpoint=u;LS.set('endpoint',u)}}catch(e){}
    try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}
  }
})();

function toast(t,ms){
  var el=document.createElement('div');el.className='toast';el.textContent=t;document.body.appendChild(el);
  setTimeout(function(){el.remove()},ms||1800);
}
function vlabel(v){return v===''?'Unica':v}
function norm(s){return String(s||'').toUpperCase().replace(/\s+/g,'')}

/* ---------- catalogo ---------- */
function loadCatalog(){
  return fetch('catalog.json',{cache:'no-cache'}).then(function(r){return r.json()}).then(function(j){
    catalog=j.items||j;
    searchIdx=[];var nv=0;
    Object.keys(catalog).forEach(function(sku){
      catalog[sku].forEach(function(p){nv+=p.v.length;searchIdx.push({sku:sku,n:p.n,key:(sku+' '+p.n).toLowerCase()})});
    });
    buildCanon();$('catinfo').textContent=Object.keys(catalog).length+' articoli · '+nv+' varianti'+(j.updated?' · '+j.updated:'');
  }).catch(function(){$('catinfo').textContent='catalogo non disponibile'});
}
function alnumOf(s){return String(s).toUpperCase().replace(/[^A-Z0-9]/g,'')}
function resolveSku(raw){
  var c=norm(raw);if(!c)return null;
  if(catalog[c])return c;
  var base=c.split('/')[0];
  if(catalog[base])return base;
  var a=alnumOf(base),best=null,bestLen=0;
  Object.keys(catalog).forEach(function(s){
    var sa=alnumOf(s);
    if(sa===a){best=s;bestLen=9999}
    else if(bestLen<9999&&a.indexOf(sa)===0&&sa.length>bestLen){best=s;bestLen=sa.length}
  });
  return best;
}

/* ---------- pannello varianti ---------- */
function vfind(m){
  var ps=catalog[m.sku]||[];
  for(var i=0;i<ps.length;i++){
    if(ps[i].n!==m.n)continue;
    for(var j=0;j<ps[i].v.length;j++){var x=ps[i].v[j];if(x===m.v||vlabel(x)===m.v)return x}
  }
  return null;
}
function openSheet(sku,opts){
  opts=opts||{};
  if(!cesta&&!opts.assoc){toast('Prima avvia una cesta',2500);return}
  current=sku;
  var prods=catalog[sku];
  $('shCode').textContent=sku+(opts.assoc?' · associa il codice '+opts.assoc:(opts.hint?' · letto dall\'etichetta':''));
  $('shName').textContent=opts.only?opts.only.n:prods.map(function(p){return p.n}).join(' / ');
  var box=$('variants');box.innerHTML='';
  var auto=null;
  prods.forEach(function(p){
    if(opts.only&&opts.only.n!==p.n)return;
    if(prods.length>1&&!opts.only){var hh=document.createElement('div');hh.className='hint';hh.textContent=p.n;box.appendChild(hh)}
    var vs=p.v;if(opts.hint){vs=p.v.map(function(v,i){return{v:v,i:i,s:vscore(v,opts.hint)}}).sort(function(a,b){return b.s-a.s||a.i-b.i}).map(function(o){return o.v})}
    vs.forEach(function(v){
      if(opts.only&&opts.only.v!==v)return;
      var key=(cesta?cesta.n:'-')+'|'+sku+'|'+p.n+'|'+v;
      var row=document.createElement('div');row.className='var';
      var lab=document.createElement('div');lab.className='lab';lab.textContent=vlabel(v);
      if(opts.hint&&vscore(v,opts.hint)>0)row.className+=' hit';
      if(opts.assoc){
        var ab=document.createElement('button');ab.type='button';ab.className='plus';ab.style.width='auto';ab.style.padding='0 14px';ab.textContent='Associa';
        ab.onclick=function(){assoc(opts.assoc,sku,p.n,v)};
        row.style.gridTemplateColumns='1fr auto';row.appendChild(lab);row.appendChild(ab);box.appendChild(row);return;
      }
      var minus=document.createElement('button');minus.type='button';minus.textContent='−';minus.setAttribute('aria-label','Togli uno '+vlabel(v));
      var n=document.createElement('div');n.className='n';n.textContent=counts[key]||0;
      var plus=document.createElement('button');plus.type='button';plus.className='plus';plus.textContent='+';plus.setAttribute('aria-label','Aggiungi uno '+vlabel(v));
      minus.onclick=function(){change(sku,p.n,v,-1,n,key)};
      plus.onclick=function(){change(sku,p.n,v,1,n,key)};
      row.appendChild(lab);row.appendChild(minus);row.appendChild(n);row.appendChild(plus);
      box.appendChild(row);
      if(opts.only)auto=plus;
    });
  });
  $('sheet').hidden=false;$('cam').hidden=true;
  $('results').innerHTML='';window.scrollTo(0,0);
  if(auto)auto.click();
  if(navigator.vibrate)try{navigator.vibrate(40)}catch(e){}
}
function assoc(code,sku,name,v){
  codes[code]={sku:sku,n:name,v:v};LS.set('codes',codes);
  queue.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,8),type:'map',ean:code,sku:sku,name:name,variant:vlabel(v),t:new Date().toISOString()});
  LS.set('queue',queue);pendingAssoc=null;flush();
  toast('Codice associato');
  openSheet(sku,{only:{n:name,v:v}});
}
function openUnknown(raw){
  current='?';pendingAssoc=raw;
  $('shCode').textContent='Codice '+raw+' non associato';
  $('shName').textContent='Cerca qui sopra l\'articolo (codice o nome, es. ABX431) e scegli la variante';
  $('variants').innerHTML='';
  $('sheet').hidden=false;
  if(navigator.vibrate)try{navigator.vibrate([60,40,60])}catch(e){}
}
function closeSheet(){$('cam').hidden=false;current=null;pendingAssoc=null;$('sheet').hidden=true;$('q').value='';$('results').innerHTML='';lastSeen={code:'',t:Date.now()};if(camOn)setMsg('Inquadra il codice a barre')}
$('closeSheet').onclick=closeSheet;

function change(sku,name,variant,delta,nEl,key){
  var cur=counts[key]||0;
  if(delta<0&&cur<=0){toast('Niente da togliere su questo telefono');return}
  if(!cesta){toast('Prima avvia una cesta',2500);return}
  counts[key]=cur+delta;
  nEl.textContent=counts[key];
  LS.set('counts',counts);
  queue.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,8),sku:sku,name:name,variant:vlabel(variant),delta:delta,cesta:cesta.n,t:new Date().toISOString()});
  LS.set('queue',queue);
  updateTotals();flush();
}
function updateTotals(){
  var t=0;if(cesta)Object.keys(counts).forEach(function(k){if(k.indexOf(cesta.n+'|')===0)t+=counts[k]});
  $('tot').textContent=cesta?(t+' pezzi in '+cesta.n):'Nessuna cesta aperta';
  if(cesta)$('cestaBadge').innerHTML=cesta.n+'<small>'+t+' pezzi</small>';
  paintStatus();
}

/* ---------- sincronizzazione con Google Sheets ---------- */
function paintStatus(state){
  var dot=$('dot'),st=$('stat');
  if(!endpoint){dot.className='dot bad';st.textContent='Foglio non collegato';return}
  if(state==='err'){dot.className='dot bad';st.textContent=queue.length+' in attesa (offline?)';return}
  if(queue.length){dot.className='dot wait';st.textContent=queue.length+' da inviare…';return}
  dot.className='dot ok';st.textContent='Sincronizzato';
}
function flush(){
  if(!endpoint){paintStatus();return}
  if(flushing||!queue.length){paintStatus();return}
  flushing=true;
  var batch=queue.slice(0,40);
  fetch(endpoint,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({events:batch}),redirect:'follow'})
  .then(function(r){return r.json()})
  .then(function(j){
    if(!j||!j.ok)throw new Error((j&&j.error)||'risposta non valida');
    var sent={};batch.forEach(function(e){sent[e.id]=1});
    queue=queue.filter(function(e){return !sent[e.id]});
    LS.set('queue',queue);flushing=false;paintStatus();
    if(queue.length)flush();
  }).catch(function(){
    flushing=false;paintStatus('err');
    clearTimeout(flushTimer);flushTimer=setTimeout(flush,6000);
  });
}
window.addEventListener('online',flush);

/* ---------- codici a barre associati (condivisi nel foglio) ---------- */
function loadCodes(){
  if(!endpoint)return Promise.resolve();
  return fetch(endpoint+(endpoint.indexOf('?')<0?'?':'&')+'action=codes',{redirect:'follow'}).then(function(r){return r.json()}).then(function(j){
    if(j&&j.ok&&j.codes){Object.keys(j.codes).forEach(function(k){codes[k]=j.codes[k]});LS.set('codes',codes)}
  }).catch(function(){});
}

/* ---------- ricerca manuale ---------- */
$('q').addEventListener('input',function(){
  var q=this.value.trim().toLowerCase();var box=$('results');box.innerHTML='';
  if(q.length<2)return;
  var words=q.split(/\s+/);
  var hits=searchIdx.filter(function(x){return words.every(function(w){return x.key.indexOf(w)>=0})}).slice(0,15);
  hits.forEach(function(h){
    var b=document.createElement('button');b.type='button';
    var a=document.createElement('span');a.textContent=h.n;
    var s=document.createElement('span');s.className='sku';s.textContent=h.sku;
    b.appendChild(a);b.appendChild(s);
    b.onclick=function(){$('q').value='';openSheet(h.sku,pendingAssoc?{assoc:pendingAssoc}:undefined)};
    box.appendChild(b);
  });
  if(!hits.length){var d=document.createElement('div');d.className='hint';d.textContent='Nessun articolo trovato';box.appendChild(d)}
});
$('q').addEventListener('keydown',function(e){
  if(e.key==='Enter'){if(/^\d{8,14}$/.test(this.value.trim())){var dg=this.value.trim();this.value='';onCode(dg);return}var s=resolveSku(this.value);if(s){this.value='';openSheet(s,pendingAssoc?{assoc:pendingAssoc}:undefined)}}
});

/* ---------- fotocamera ---------- */
var stream=null,controls=null,detector=null,timer=null,camOn=false;
function onCode(raw){
  raw=String(raw||'').trim();if(!raw)return;
  if(current)return;
  if(!cesta){setMsg('Avvia una cesta per iniziare');return}
  setMsg('Letto: '+raw);
  var now=Date.now();
  if(raw===lastSeen.code&&now-lastSeen.t<2500)return;
  lastSeen={code:raw,t:now};
  var m=codes[raw];
  if(m&&catalog[m.sku]){var vv=vfind(m);openSheet(m.sku,vv===null?undefined:{only:{n:m.n,v:vv}});return}
  var sku=resolveSku(raw);
  if(sku){openSheet(sku);return}
  openUnknown(raw);
}
function setMsg(t){$('camMsg').textContent=t}
function stopCamera(){
  camOn=false;ocrRun=false;
  if(timer){clearInterval(timer);timer=null}
  if(controls){try{controls.stop()}catch(e){}controls=null}
  if(stream){stream.getTracks().forEach(function(t){t.stop()});stream=null}
  $('video').srcObject=null;
}
var zr=null,zc=null,zx=null;
var Zangles=[0,-2,2,-4,4];
var Zvars=[[0.6,0.4,3,0],[0.84,0.56,1.8,0],[0.6,0.4,3,1],[0.84,0.56,1.8,1]];
function initZ(){
  var Z=window.ZXing,hs=new Map();
  hs.set(Z.DecodeHintType.POSSIBLE_FORMATS,[Z.BarcodeFormat.EAN_13,Z.BarcodeFormat.CODE_128,Z.BarcodeFormat.EAN_8,Z.BarcodeFormat.CODE_39,Z.BarcodeFormat.UPC_A]);
  hs.set(Z.DecodeHintType.TRY_HARDER,true);
  zr=new Z.MultiFormatReader();zr.setHints(hs);
  zc=document.createElement('canvas');zx=zc.getContext('2d',{willReadFrequently:true});
}
function zDecode(src,sx,sy,sw,sh,scale,ang,glob){
  var Z=window.ZXing;
  var cw=Math.round(sw*scale),ch=Math.round(sh*scale);
  zc.width=cw;zc.height=ch;
  zx.fillStyle='#fff';zx.fillRect(0,0,cw,ch);
  zx.save();zx.translate(cw/2,ch/2);zx.rotate(ang*Math.PI/180);
  zx.drawImage(src,sx,sy,sw,sh,-cw/2,-ch/2,cw,ch);zx.restore();
  try{
    var ls=new Z.HTMLCanvasElementLuminanceSource(zc);
    var b=glob?new Z.GlobalHistogramBinarizer(ls):new Z.HybridBinarizer(ls);
    return zr.decode(new Z.BinaryBitmap(b)).getText();
  }catch(e){return null}
}
function zScan(video,vw,vh,tick){
  var n=Zangles.length*Zvars.length,i=tick%n;
  var v=Zvars[Math.floor(i/Zangles.length)],ang=Zangles[i%Zangles.length];
  var sw=vw*v[0],sh=vh*v[1];
  return zDecode(video,(vw-sw)/2,(vh-sh)/2,sw,sh,Math.min(v[2],2000/sw),ang,v[3]);
}
function startCamera(){
  stopCamera();
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){setMsg('Fotocamera non disponibile: usa Foto o la ricerca');return}
  camOn=true;setMsg('Avvio fotocamera…');
  var video=$('video');
  navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false}).then(function(s){
    stream=s;video.srcObject=s;
    try{s.getVideoTracks()[0].applyConstraints({advanced:[{focusMode:'continuous'}]}).catch(function(){})}catch(e){}
    return video.play();
  }).then(function(){
    var native='BarcodeDetector' in window;
    if(native){try{detector=new BarcodeDetector({formats:['code_128','ean_13','ean_8','code_39','upc_a','qr_code']})}catch(e){detector=new BarcodeDetector()}}
    else if(window.ZXing){initZ()}
    else{setMsg('Lettore non caricato: usa Foto o la ricerca');return}
    var tick=0;
    timer=setInterval(function(){
      if(current||video.readyState<2||!video.videoWidth)return;
      if(!cesta){if(tick++%8===0)setMsg('Avvia una cesta per iniziare');return}
      tick++;
      if(tick%8===1)setMsg('Inquadra il codice a barre · '+video.videoWidth+'×'+video.videoHeight);
      if(native){detector.detect(video).then(function(r){if(r&&r.length)onCode(r[0].rawValue)}).catch(function(){})}
      else{var t=zScan(video,video.videoWidth,video.videoHeight,tick);if(t)onCode(t)}
    },native?250:340);
    ocrStart(video);
  }).catch(camError);
}
function camError(e){
  camOn=false;
  var n=e&&e.name;
  setMsg(n==='NotAllowedError'?'Permesso fotocamera negato: abilitalo nelle impostazioni del browser':'Fotocamera non disponibile: usa la ricerca');
}
$('camBtn').onclick=function(){if(camOn){stopCamera();setMsg('Fotocamera spenta');this.textContent='Fotocamera'}else{startCamera();this.textContent='Spegni'}};
$('camBtn').textContent='Spegni';
document.addEventListener('visibilitychange',function(){if(document.hidden){if(camOn){stopCamera();$('camBtn').textContent='Fotocamera';setMsg('Fotocamera in pausa')}}});

/* ---------- lettura del testo: codice articolo stampato sull'etichetta ---------- */
var ocrW=null,ocrRun=false,ocrCanvas=null,ocrCtx=null,ocrReady=false,ocrLoading=null,canonIdx=null,ocrLast={sku:'',n:0,tokens:{}};
var COLORS={BLACK:'NERO',WHITE:'BIANCO',RED:'ROSSO',BLUE:'BLU',GREEN:'VERDE',GREY:'GRIGIO',GRAY:'GRIGIO',PINK:'ROSA',YELLOW:'GIALLO',ORANGE:'ARANCIONE',BROWN:'MARRONE',NAVY:'BLU',PURPLE:'VIOLA',GOLD:'ORO',SILVER:'ARGENTO',CAMO:'CAMOUFLAGE'};
function canon(s){return alnumOf(s).replace(/O/g,'0').replace(/[IL]/g,'1').replace(/S/g,'5').replace(/B/g,'8').replace(/Z/g,'2')}
function buildCanon(){canonIdx={};Object.keys(catalog).forEach(function(k){if(/^MB-/.test(k))return;var c=canon(k);canonIdx[c]=(c in canonIdx)?null:k})}
function ocrMatch(words){
  var best=null;
  words.forEach(function(w){
    var t=String(w.text||'').toUpperCase().split('/')[0];
    var a=alnumOf(t);if(a.length<4||(w.confidence||0)<45)return;
    var k=canonIdx&&canonIdx[canon(a)];
    if(k&&(!best||w.confidence>best.conf))best={sku:k,conf:w.confidence};
  });
  return best;
}
function ocrTokens(words,into){
  words.forEach(function(w){
    if((w.confidence||0)<40)return;
    String(w.text||'').toUpperCase().split(/[^A-Z0-9]+/).forEach(function(t){if(t){into[t]=1;if(COLORS[t])into[COLORS[t]]=1}});
  });
}
function vscore(v,T){
  var s=0;
  String(v).toUpperCase().split(/\s*\/\s*/).forEach(function(part){
    var ws=part.trim().split(/\s+/);
    if(ws[0]&&ws.every(function(x){return T[x]}))s++;
  });
  return s;
}
function ocrInit(){
  if(ocrReady)return Promise.resolve(true);
  if(ocrLoading)return ocrLoading;
  ocrLoading=new Promise(function(res,rej){
    if(window.Tesseract)return res();
    var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
    s.onload=res;s.onerror=function(){rej(new Error('script'))};document.head.appendChild(s);
  }).then(function(){return Tesseract.createWorker('eng')}).then(function(w){
    ocrW=w;
    return w.setParameters({tessedit_pageseg_mode:'11',tessedit_char_whitelist:'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789-/'});
  }).then(function(){ocrReady=true;return true}).catch(function(){ocrLoading=null;return false});
  return ocrLoading;
}
function ocrRecognize(canvas){return ocrW.recognize(canvas).then(function(r){return (r&&r.data&&r.data.words)||[]})}
function invertedCopy(src){
  var c=document.createElement('canvas');c.width=src.width;c.height=src.height;
  var x=c.getContext('2d',{willReadFrequently:true});x.drawImage(src,0,0);
  var d=x.getImageData(0,0,c.width,c.height),p=d.data;
  for(var i=0;i<p.length;i+=4){p[i]=255-p[i];p[i+1]=255-p[i+1];p[i+2]=255-p[i+2]}
  x.putImageData(d,0,0);return c;
}
function ocrStart(video){
  if(ocrRun)return;
  ocrRun=true;
  setMsg(ocrReady?'Inquadra l\'etichetta con il codice articolo':'Carico il lettore di testo… (solo la prima volta)');
  ocrInit().then(function(ok){
    if(!ok){ocrRun=false;setMsg('Lettore testo non disponibile: usa Foto o la ricerca');return}
    if(!ocrCanvas){ocrCanvas=document.createElement('canvas');ocrCtx=ocrCanvas.getContext('2d',{willReadFrequently:true})}
    setMsg('Inquadra l\'etichetta con il codice articolo');
    ocrLoop(video);
  });
}
function ocrLoop(video){
  if(!ocrRun||!camOn)return;
  if(current||!cesta||video.readyState<2||!video.videoWidth){setTimeout(function(){ocrLoop(video)},300);return}
  var vw=video.videoWidth,vh=video.videoHeight,sw=vw*0.84,sh=vh*0.56,sc=Math.min(1,1400/sw);
  ocrCanvas.width=Math.round(sw*sc);ocrCanvas.height=Math.round(sh*sc);
  ocrCtx.drawImage(video,(vw-sw)/2,(vh-sh)/2,sw,sh,0,0,ocrCanvas.width,ocrCanvas.height);
  ocrRecognize(ocrCanvas).then(function(words){
    if(!ocrRun||current)return;
    var seen=words.filter(function(w){return String(w.text).length>=3&&w.confidence>=50}).slice(0,4).map(function(w){return w.text});
    var m=ocrMatch(words);
    if(m){
      var tk={};ocrTokens(words,tk);
      if(ocrLast.sku===m.sku){for(var k in tk)ocrLast.tokens[k]=1;ocrLast.n++}else ocrLast={sku:m.sku,n:1,tokens:tk};
      if(ocrLast.n>=2){var tokens=ocrLast.tokens;ocrLast={sku:'',n:0,tokens:{}};return finishOcr(m.sku,tokens,ocrCanvas)}
      setMsg('Letto: '+m.sku+' … confermo');
    }else{
      ocrLast={sku:'',n:0,tokens:{}};
      setMsg(seen.length?'Vedo: '+seen.join(' '):'Inquadra l\'etichetta con il codice articolo');
    }
  }).catch(function(){}).then(function(){setTimeout(function(){ocrLoop(video)},120)});
}
function finishOcr(sku,tokens,canvas){
  return ocrRecognize(invertedCopy(canvas)).catch(function(){return []}).then(function(w2){
    ocrTokens(w2,tokens);
    if(current)return;
    lastSeen={code:sku,t:Date.now()};
    setMsg('Letto: '+sku);
    openSheet(sku,{hint:tokens});
  });
}

/* ---------- foto dell'etichetta ---------- */
$('photoBtn').onclick=function(){$('photo').click()};
function photoBarcode(img){
  if(!window.ZXing){toast('Non riconosco il codice: avvicinati e rifai la foto',3500);return}
  if(!zr)initZ();
  var w=img.naturalWidth,hh=img.naturalHeight,found=null,crops=[[1,1],[0.7,0.7],[0.5,0.5]];
  outer:for(var c=0;c<crops.length;c++){
    var sw=w*crops[c][0],sh=hh*crops[c][1],scale=Math.min(1,2200/sw);
    for(var a=0;a<Zangles.length;a++){
      for(var g=0;g<2;g++){
        found=zDecode(img,(w-sw)/2,(hh-sh)/2,sw,sh,scale,Zangles[a],g);
        if(found)break outer;
      }
    }
  }
  if(found){lastSeen={code:'',t:0};onCode(found)}else toast('Non riconosco il codice: avvicinati all\'etichetta e rifai la foto',3500);
}
$('photo').onchange=function(){
  var f=this.files&&this.files[0];this.value='';if(!f)return;
  if(!cesta){toast('Prima avvia una cesta',2500);return}
  toast('Leggo la foto…',1800);
  var img=new Image(),url=URL.createObjectURL(f);
  img.onload=function(){
    var sc=Math.min(1,1800/Math.max(img.naturalWidth,img.naturalHeight));
    var cv=document.createElement('canvas');cv.width=Math.round(img.naturalWidth*sc);cv.height=Math.round(img.naturalHeight*sc);
    cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
    ocrInit().then(function(ok){
      if(!ok)return null;
      return ocrRecognize(cv).then(function(words){
        var m=ocrMatch(words);if(!m)return null;
        var tk={};ocrTokens(words,tk);
        return ocrRecognize(invertedCopy(cv)).catch(function(){return []}).then(function(w2){ocrTokens(w2,tk);return{sku:m.sku,tk:tk}});
      }).catch(function(){return null});
    }).then(function(r){
      if(r){lastSeen={code:r.sku,t:Date.now()};openSheet(r.sku,{hint:r.tk})}
      else photoBarcode(img);
      URL.revokeObjectURL(url);
    });
  };
  img.onerror=function(){toast('Foto non leggibile')};
  img.src=url;
};

updateTotals();

/* ---------- ceste ---------- */
function pushCesta(action,name){
  queue.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,8),type:'cesta',action:action,cesta:name,t:new Date().toISOString()});
  LS.set('queue',queue);flush();
}
function paintCesta(){
  $('cestaNew').hidden=!!cesta;$('cestaOn').hidden=!cesta;
  if(!cesta&&camOn)setMsg('Avvia una cesta per iniziare');
  updateTotals();
}
function startCesta(){
  var raw=$('cestaN').value.toUpperCase().replace(/^CESTA/,'').replace(/[^A-Z0-9]/g,'');
  if(!raw){toast('Scrivi il numero della cesta',2500);return}
  cesta={n:'CESTA '+raw,t:Date.now()};LS.set('cesta',cesta);
  $('cestaN').value='';
  pushCesta('start',cesta.n);paintCesta();
  if(camOn)setMsg('Inquadra l\'etichetta');
}
$('cestaStart').onclick=startCesta;
$('cestaN').onkeydown=function(e){if(e.key==='Enter')startCesta()};
$('cestaEnd').onclick=function(){
  if(!cesta)return;
  var t=0,r=0;Object.keys(counts).forEach(function(k){if(k.indexOf(cesta.n+'|')===0&&counts[k]>0){t+=counts[k];r++}});
  $('endTitle').textContent='Chiudere '+cesta.n+'?';
  $('endMsg').textContent=t+' pezzi in '+r+' righe. Dopo la chiusura dovrai avviare un\'altra cesta per continuare.';
  $('endDlg').showModal();
};
$('endNo').onclick=function(){$('endDlg').close()};
$('endYes').onclick=function(){
  $('endDlg').close();
  var name=cesta.n;
  if(current)closeSheet();
  pushCesta('close',name);
  cesta=null;LS.set('cesta',null);
  paintCesta();toast(name+' chiusa',2500);
};
paintCesta();
loadCatalog().then(function(){startCamera();flush();loadCodes()});
window.__leone={ocr:{init:ocrInit,rec:ocrRecognize,match:ocrMatch,tokens:ocrTokens,inv:invertedCopy,open:function(s,t){openSheet(s,{hint:t})}},zDecode:function(){return zr?zDecode.apply(null,arguments):(initZ(),zDecode.apply(null,arguments))},codes:function(){return codes},resolveSku:resolveSku,catalog:function(){return catalog},onCode:onCode,queue:function(){return queue}};
})();
